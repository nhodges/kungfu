name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_TEST }}
  NEXTAUTH_URL: "http://localhost:3000"
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_TEST }}
  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_TEST }}
  X_CLIENT_ID: ${{ secrets.X_CLIENT_ID_TEST }}
  X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET_TEST }}
  LOG_LEVEL: "error"

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kungfu_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Integration Tests
        run: npm run test

      - name: Build
        run: npm run build
